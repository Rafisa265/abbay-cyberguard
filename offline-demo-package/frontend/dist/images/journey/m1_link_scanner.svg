<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgM1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030919"/>
      <stop offset="50%" stop-color="#091836"/>
      <stop offset="100%" stop-color="#020612"/>
    </linearGradient>
    <linearGradient id="cyanBlueM1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="glowM1" cx="50%" cy="45%" r="42%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#030919" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonM1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="gridM1" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#00f0ff" stroke-width="0.75" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bgM1)"/>
  <rect width="800" height="450" fill="url(#gridM1)"/>
  <circle cx="400" cy="210" r="195" fill="url(#glowM1)"/>

  <!-- Radar Scanning Dish -->
  <circle cx="400" cy="205" r="160" fill="none" stroke="#00f0ff" stroke-width="1.2" stroke-dasharray="14 10" stroke-opacity="0.35"/>
  <circle cx="400" cy="205" r="110" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="20 14" stroke-opacity="0.45"/>
  <circle cx="400" cy="205" r="60" fill="none" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Scanning Sweep Beam -->
  <polygon points="400,205 520,100 550,150" fill="#00f0ff" fill-opacity="0.15"/>

  <!-- Central URL Dissection Terminal -->
  <rect x="230" y="165" width="340" height="80" rx="12" fill="#05142d" stroke="url(#cyanBlueM1)" stroke-width="2.5" filter="url(#neonM1)"/>
  <circle cx="260" cy="205" r="14" fill="#0284c7" stroke="#00f0ff" stroke-width="2"/>
  <path d="M 255 205 L 265 205 M 260 200 L 260 210" stroke="#f8fafc" stroke-width="2"/>

  <text x="290" y="195" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="1" fill="#38bdf8">URL HEURISTIC INSPECTOR</text>
  <text x="290" y="222" font-family="'Consolas', monospace" font-size="12" fill="#e2e8f0">https://target.domain/verify</text>

  <!-- Threat Indicators Pills -->
  <rect x="170" y="90" width="130" height="28" rx="14" fill="#1e1338" stroke="#a855f7" stroke-width="1.5"/>
  <text x="235" y="108" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#e9d5ff" text-anchor="middle">⚡ PUNYCODE SCAN</text>

  <rect x="500" y="90" width="130" height="28" rx="14" fill="#24101e" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="565" y="108" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#fda4af" text-anchor="middle">🚨 IP HOST ALERT</text>

  <rect x="170" y="310" width="140" height="28" rx="14" fill="#08202a" stroke="#10b981" stroke-width="1.5"/>
  <text x="240" y="328" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#6ee7b7" text-anchor="middle">🛡️ OFFLINE HEURISTICS</text>

  <rect x="490" y="310" width="140" height="28" rx="14" fill="#091b38" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="560" y="328" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#7dd3fc" text-anchor="middle">🌐 OPTIONAL CTI V5</text>

  <!-- Status Bar -->
  <rect x="240" y="388" width="320" height="34" rx="17" fill="#071a36" stroke="#00f0ff" stroke-width="1.5"/>
  <circle cx="262" cy="405" r="5" fill="#00f0ff"/>
  <text x="400" y="410" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#38bdf8" text-anchor="middle">M1 • SUSPICIOUS LINK INSPECTOR</text>
</svg>
