<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgM2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020914"/>
      <stop offset="50%" stop-color="#07182c"/>
      <stop offset="100%" stop-color="#01060e"/>
    </linearGradient>
    <linearGradient id="emeraldCyanM2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="glowM2" cx="50%" cy="45%" r="42%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#00f0ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#020914" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonM2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="gridM2" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#10b981" stroke-width="0.75" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bgM2)"/>
  <rect width="800" height="450" fill="url(#gridM2)"/>
  <circle cx="400" cy="210" r="195" fill="url(#glowM2)"/>

  <!-- Rotating Cryptographic Cipher Ring -->
  <circle cx="400" cy="205" r="145" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="16 12" stroke-opacity="0.4"/>
  <circle cx="400" cy="205" r="105" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="24 16" stroke-opacity="0.5"/>

  <!-- High-Tech Vault Door / Padlock Crest -->
  <polygon points="400,90 490,140 490,250 400,310 310,250 310,140" fill="#061a30" stroke="url(#emeraldCyanM2)" stroke-width="3" filter="url(#neonM2)"/>

  <!-- Padlock Shackle & Keyhole -->
  <path d="M 370 180 L 370 145 C 370 125 430 125 430 145 L 430 180" fill="none" stroke="#00f0ff" stroke-width="4"/>
  <circle cx="400" cy="215" r="18" fill="#031020" stroke="#10b981" stroke-width="2.5"/>
  <path d="M 400 222 L 400 236" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>

  <!-- Entropy Bit Indicators -->
  <rect x="330" y="270" width="140" height="22" rx="4" fill="#030e1d" stroke="#10b981" stroke-width="1"/>
  <text x="400" y="285" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" letter-spacing="1" fill="#34d399" text-anchor="middle">ENTROPY: 128-BIT</text>

  <!-- Left/Right Terminal Telemetry -->
  <rect x="130" y="190" width="140" height="40" rx="8" fill="#05162a" stroke="#00f0ff" stroke-width="1.5"/>
  <text x="200" y="208" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#94a3b8" text-anchor="middle">CSPRNG SYSTEM</text>
  <text x="200" y="222" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#38bdf8" text-anchor="middle">CLIENT-SIDE ONLY</text>

  <rect x="530" y="190" width="140" height="40" rx="8" fill="#05162a" stroke="#10b981" stroke-width="1.5"/>
  <text x="600" y="208" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#94a3b8" text-anchor="middle">ZERO LEAKAGE</text>
  <text x="600" y="222" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#34d399" text-anchor="middle">NEVER STORED</text>

  <!-- Status Bar -->
  <rect x="235" y="388" width="330" height="34" rx="17" fill="#06192e" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="257" cy="405" r="5" fill="#10b981"/>
  <text x="400" y="410" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#34d399" text-anchor="middle">M2 • LOCAL CRYPTO KEY VAULT</text>
</svg>
