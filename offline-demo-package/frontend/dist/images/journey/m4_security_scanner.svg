    <text x="12" y="75" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#34d399">✓ MODERN PROTOCOL SUITE</text>

    <rect x="0" y="92" width="270" height="36" rx="6" fill="#1f1028" stroke="#f43f5e" stroke-width="1"/>
