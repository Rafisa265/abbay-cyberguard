<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgM4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050616"/>
      <stop offset="50%" stop-color="#0f0c29"/>
      <stop offset="100%" stop-color="#030412"/>
    </linearGradient>
    <linearGradient id="cyanMagentaM4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glowM4" cx="50%" cy="45%" r="42%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#050616" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonM4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="gridM4" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#00f0ff" stroke-width="0.75" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bgM4)"/>
  <rect width="800" height="450" fill="url(#gridM4)"/>
  <circle cx="400" cy="210" r="195" fill="url(#glowM4)"/>

  <!-- Server Diagnostic Terminal Console -->
  <rect x="240" y="80" width="320" height="270" rx="14" fill="#090f2b" stroke="url(#cyanMagentaM4)" stroke-width="3" filter="url(#neonM4)"/>
  <rect x="240" y="80" width="320" height="30" rx="14" fill="#05081c"/>
  <circle cx="260" cy="95" r="4" fill="#f43f5e"/>
  <circle cx="274" cy="95" r="4" fill="#fbbf24"/>
  <circle cx="288" cy="95" r="4" fill="#34d399"/>
