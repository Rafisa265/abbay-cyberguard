<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-m03" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041217" />
      <stop offset="50%" stop-color="#08202b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="emerald-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <radialGradient id="vault-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#041217" stop-opacity="0" />
    </radialGradient>
    <filter id="neon-glow-m03" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Emerald / Deep Teal Background -->
  <rect width="800" height="450" fill="url(#bg-grad-m03)" />

  <!-- Binary Circuit Lines -->
  <g stroke="#064e3b" stroke-width="1.2" opacity="0.4">
    <path d="M 0,90 L 250,90 L 280,130 L 450,130" fill="none" />
    <path d="M 120,380 L 320,380 L 350,330 L 550,330" fill="none" />
    <path d="M 800,200 L 650,200 L 610,250 L 500,250" fill="none" />
  </g>

  <!-- Left: Rogue Chatbot Wireframe -->
  <g transform="translate(240, 220)">
    <circle cx="0" cy="0" r="110" fill="none" stroke="#047857" stroke-width="1" stroke-dasharray="4,6" opacity="0.5" />
    <!-- Bot Head Hexagon -->
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="#062e24" stroke="#10b981" stroke-width="2.5" />
    
    <!-- Bot Glowing Eyes -->
    <circle cx="-20" cy="-10" r="7" fill="#ef4444" filter="url(#neon-glow-m03)" />
    <circle cx="20" cy="-10" r="7" fill="#ef4444" filter="url(#neon-glow-m03)" />
    <!-- Scanning Radar Line across Eyes -->
    <line x1="-36" y1="-10" x2="36" y2="-10" stroke="#f87171" stroke-width="1.5" />

    <!-- Chat Prompt Glyph -->
    <path d="M -20,20 L 20,20 M -12,28 L 12,28" stroke="#34d399" stroke-width="2" />
    <text x="0" y="85" text-anchor="middle" fill="#f87171" font-family="monospace" font-size="10" font-weight="700">ROGUE BOT INTERCEPT</text>
  </g>

  <!-- Right: Digital Bank Vault & Pin Defense Shield -->
  <g transform="translate(540, 225)" filter="url(#neon-glow-m03)">
    <circle cx="0" cy="0" r="150" fill="url(#vault-glow)" />

    <!-- Vault Outer Gear -->
    <circle cx="0" cy="0" r="95" fill="#042f2e" stroke="url(#emerald-cyan)" stroke-width="3" />
    <circle cx="0" cy="0" r="75" fill="#022c22" stroke="#10b981" stroke-width="1" stroke-dasharray="6,4" />

    <!-- Vault Handle Spokes -->
    <g stroke="#34d399" stroke-width="4">
      <line x1="0" y1="-60" x2="0" y2="60" />
      <line x1="-60" y1="0" x2="60" y2="0" />
      <line x1="-42" y1="-42" x2="42" y2="42" />
      <line x1="-42" y1="42" x2="42" y2="-42" />
    </g>

    <!-- Center Vault Core Lock -->
    <circle cx="0" cy="0" r="32" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
    <text x="0" y="6" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="18" font-weight="900">ETB</text>
  </g>

  <!-- Financial Threat Alert Card -->
  <g transform="translate(60, 330)">
    <rect x="0" y="0" width="360" height="60" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" opacity="0.95" />
    <text x="16" y="24" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">🛡️ SECURE FINANCIAL GATEWAY PROTECTED</text>
    <text x="16" y="44" fill="#94a3b8" font-family="monospace" font-size="10">REJECTED 4-DIGIT PIN REQUEST ON THIRD-PARTY BOT</text>
  </g>

  <!-- Header Mission Badge -->
  <g transform="translate(60, 40)">
    <rect x="0" y="0" width="180" height="26" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <text x="12" y="17" fill="#6ee7b7" font-family="monospace" font-size="11" font-weight="700">M03 // BANKING DEFENDER</text>
  </g>
</svg>
