<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040914" />
      <stop offset="60%" stop-color="#0a142e" />
      <stop offset="100%" stop-color="#111c38" />
    </linearGradient>
    <linearGradient id="green-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg2)" />

  <!-- Header Badge -->
  <rect x="40" y="24" width="370" height="34" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
  <text x="55" y="46" fill="#10b981" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="1.5">PASSWORD ENTROPY &amp; PASSPHRASE MATRIX</text>
  <text x="430" y="46" fill="#94a3b8" font-family="sans-serif" font-size="13">Module M2 Cryptographic Vault</text>

  <!-- Comparison Left: Weak Password -->
  <rect x="40" y="76" width="345" height="260" rx="10" fill="#1a0f12" stroke="#ef4444" stroke-width="1.5" />
  <rect x="56" y="92" width="140" height="26" rx="4" fill="#ef4444" fill-opacity="0.2" />
  <text x="68" y="110" fill="#f87171" font-family="sans-serif" font-size="11" font-weight="bold">❌ WEAK PASSWORD</text>

  <rect x="56" y="130" width="313" height="42" rx="6" fill="#090d16" stroke="#475569" />
  <text x="70" y="157" fill="#fca5a5" font-family="monospace" font-size="16" font-weight="bold">P@ssw0rd123!</text>

  <g font-family="sans-serif" font-size="12" fill="#cbd5e1">
    <text x="56" y="200">• Length: 12 characters (Predictable pattern)</text>
    <text x="56" y="224">• Shannon Entropy: <tspan fill="#f87171" font-weight="bold">38.4 bits</tspan></text>
    <text x="56" y="248">• Common Dictionary Leaks: Yes (RockYou)</text>
    <text x="56" y="272">• Offline Cracking Time (RTX 4090 GPU):</text>
    <rect x="56" y="284" width="180" height="28" rx="4" fill="#ef4444" fill-opacity="0.25" />
    <text x="68" y="303" fill="#fca5a5" font-weight="bold">⚡ ~ 2.4 MINUTES</text>
  </g>

  <!-- Comparison Right: Strong Passphrase -->
  <rect x="415" y="76" width="345" height="260" rx="10" fill="#0c1d1a" stroke="#10b981" stroke-width="1.5" />
  <rect x="431" y="92" width="180" height="26" rx="4" fill="#10b981" fill-opacity="0.2" />
  <text x="443" y="110" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold">✅ HIGH-ENTROPY PASSPHRASE</text>

  <rect x="431" y="130" width="313" height="42" rx="6" fill="#090d16" stroke="#475569" />
  <text x="443" y="157" fill="#a7f3d0" font-family="monospace" font-size="14" font-weight="bold">fasil-buna-harar-shield-guji</text>

  <g font-family="sans-serif" font-size="12" fill="#cbd5e1">
    <text x="431" y="200">• Length: 28 characters (5 discrete dictionary words)</text>
    <text x="431" y="224">• Shannon Entropy: <tspan fill="#34d399" font-weight="bold">92.6 bits</tspan></text>
    <text x="431" y="248">• Pattern Guessing Complexity: 10^24 combinations</text>
    <text x="431" y="272">• Offline Cracking Time (Cluster Brute Force):</text>
    <rect x="431" y="284" width="220" height="28" rx="4" fill="#10b981" fill-opacity="0.25" />
    <text x="443" y="303" fill="#6ee7b7" font-weight="bold">🛡️ ~ 4.2 MILLION CENTURIES</text>
  </g>

  <!-- Formula & 2FA Layer Bottom Banner -->
  <rect x="40" y="352" width="720" height="78" rx="8" fill="#091428" stroke="#00f0ff" stroke-width="1.2" />
  <text x="60" y="376" fill="#00f0ff" font-family="sans-serif" font-size="12" font-weight="bold">MATHEMATICAL ENTROPY: E = L × log₂(R)</text>
  <text x="60" y="398" fill="#e2e8f0" font-family="sans-serif" font-size="11">Where L = length, R = character pool size. Length dominates brute-force resistance over symbol substitutions.</text>
  <text x="60" y="418" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">DEFENSE RECOMMENDATION: Combine a 20+ character passphrase with TOTP / FIDO2 Passkey authentication.</text>
</svg>