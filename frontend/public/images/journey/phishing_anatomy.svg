  <text x="60" y="390" fill="#00f0ff" font-family="sans-serif" font-size="12" font-weight="bold">🛡️ CYBERSHIELD DEFENSIVE RULES (SR-07 &amp; M1 HEURISTICS):</text>
  <text x="60" y="413" fill="#cbd5e1" font-family="sans-serif" font-size="11">1. Read domains from right to left before the first slash.  2. Legitimate Ethiopian banks use .com.et or .et, never raw IP or .xyz.  3. Never enter OTPs or PINs from unsolicited links.</text>
