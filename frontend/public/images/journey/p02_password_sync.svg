<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgP02" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04081c"/>
      <stop offset="50%" stop-color="#0e173a"/>
      <stop offset="100%" stop-color="#030614"/>
    </linearGradient>
    <linearGradient id="redCyanP02" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="glowP02" cx="50%" cy="45%" r="42%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#04081c" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonP02" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="gridP02" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#00f0ff" stroke-width="0.75" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bgP02)"/>
  <rect width="800" height="450" fill="url(#gridP02)"/>
  <circle cx="400" cy="210" r="195" fill="url(#glowP02)"/>

  <!-- Portal Login Window Mockup -->
  <rect x="250" y="80" width="300" height="270" rx="12" fill="#09142f" stroke="url(#redCyanP02)" stroke-width="3" filter="url(#neonP02)"/>
  <rect x="250" y="80" width="300" height="32" rx="12" fill="#050e24"/>
  <circle cx="270" cy="96" r="4" fill="#f43f5e"/>
  <circle cx="284" cy="96" r="4" fill="#fbbf24"/>
  <circle cx="298" cy="96" r="4" fill="#34d399"/>
  <text x="400" y="100" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="1" fill="#94a3b8" text-anchor="middle">CAMPUS-PORTAL-SYNC.INVALID</text>

  <!-- 15-Minute Expiration Countdown Ring -->
  <circle cx="400" cy="180" r="42" fill="#040c20" stroke="#f43f5e" stroke-width="3" stroke-dasharray="160 50" filter="url(#neonP02)"/>
  <text x="400" y="185" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#f43f5e" text-anchor="middle">15:00</text>
  <text x="400" y="200" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" letter-spacing="1" fill="#fda4af" text-anchor="middle">EXPIRES</text>

  <!-- Password input mask -->
  <rect x="290" y="245" width="220" height="34" rx="6" fill="#030919" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="310" y="267" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" letter-spacing="4" fill="#00f0ff">••••••••••••</text>
  <rect x="470" y="254" width="28" height="16" rx="3" fill="#1e293b"/>
  <circle cx="484" cy="262" r="3" fill="#94a3b8"/>

  <!-- Defensive Direct Nav Shield -->
  <circle cx="400" cy="315" r="22" fill="#051733" stroke="#10b981" stroke-width="2.5"/>
  <path d="M 393 315 L 398 320 L 409 309" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Status Bar -->
  <rect x="240" y="390" width="320" height="34" rx="17" fill="#071b38" stroke="#00f0ff" stroke-width="1.5"/>
  <circle cx="262" cy="407" r="5" fill="#00f0ff"/>
  <text x="400" y="412" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#38bdf8" text-anchor="middle">PASSWORD HARVEST DEFENSE MATRIX</text>
</svg>
