<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060918" />
      <stop offset="100%" stop-color="#0d1830" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg8)" />

  <!-- Title Badge -->
  <rect x="40" y="24" width="370" height="34" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
  <text x="55" y="46" fill="#f59e0b" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="1.5">DAILY CYBER DEFENSE CHALLENGE ENGINE</text>
  <text x="430" y="46" fill="#94a3b8" font-family="sans-serif" font-size="13">Rotating 30-Day Scenario Bank</text>

  <!-- Left: Calendar Illustration -->
  <g transform="translate(60, 85)">
    <rect width="260" height="250" rx="10" fill="#0d1b33" stroke="#334155" stroke-width="1.5" />
    <!-- Calendar Top Bar -->
    <rect width="260" height="45" rx="10" fill="#ef4444" />
    <text x="130" y="28" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">DAILY CHALLENGE</text>

    <!-- Calendar Grid of Days -->
    <g font-family="monospace" font-size="12" fill="#94a3b8">
      <text x="35" y="75">M</text><text x="70" y="75">T</text><text x="105" y="75">W</text><text x="140" y="75">T</text><text x="175" y="75">F</text><text x="210" y="75">S</text><text x="235" y="75">S</text>
      <!-- Completed Days with checkmarks -->
      <circle cx="38" cy="105" r="12" fill="#10b981" /><text x="34" y="110" fill="#ffffff">✓</text>
      <circle cx="73" cy="105" r="12" fill="#10b981" /><text x="69" y="110" fill="#ffffff">✓</text>
      <circle cx="108" cy="105" r="12" fill="#10b981" /><text x="104" y="110" fill="#ffffff">✓</text>
      <circle cx="143" cy="105" r="12" fill="#10b981" /><text x="139" y="110" fill="#ffffff">✓</text>
      <circle cx="178" cy="105" r="12" fill="#10b981" /><text x="174" y="110" fill="#ffffff">✓</text>
      <!-- Today's active day -->
      <circle cx="213" cy="105" r="14" fill="#f59e0b" stroke="#ffffff" stroke-width="2" />
      <text x="207" y="110" fill="#ffffff" font-weight="bold">★</text>
      <!-- Upcoming days -->
      <circle cx="240" cy="105" r="10" fill="#1e293b" /><text x="236" y="109" fill="#64748b">7</text>
    </g>

    <!-- Streak Badge -->
    <rect x="20" y="180" width="220" height="45" rx="6" fill="#1c1308" stroke="#f59e0b" stroke-width="1.2" />
    <text x="35" y="208" fill="#f59e0b" font-family="sans-serif" font-size="12" font-weight="bold">🔥 ACTIVE DEFENSE STREAK</text>
  </g>

  <!-- Right: Engine Principles -->
  <g transform="translate(360, 85)">
    <!-- Principle 1 -->
    <rect width="380" height="70" rx="8" fill="#0b172a" stroke="#38bdf8" stroke-width="1.2" />
    <text x="16" y="26" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">1. DETERMINISTIC DAILY ROTATION</text>
    <text x="16" y="48" fill="#cbd5e1" font-family="sans-serif" font-size="11">A new challenge activates each day based on the calendar date string</text>
    <text x="16" y="63" fill="#94a3b8" font-family="sans-serif" font-size="10">(e.g. 2026-10-30). All users see the same rotating scenario.</text>

    <!-- Principle 2 -->
    <g transform="translate(0, 85)">
      <rect width="380" height="70" rx="8" fill="#0b172a" stroke="#10b981" stroke-width="1.2" />
      <text x="16" y="26" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="bold">2. STRICT ANTI-DUPLICATE XP (IDEMPOTENCY)</text>
      <text x="16" y="48" fill="#cbd5e1" font-family="sans-serif" font-size="11">First correct submission awards +50 XP. Subsequent submissions on</text>
      <text x="16" y="63" fill="#94a3b8" font-family="sans-serif" font-size="10">the same calendar day award 0 XP to prevent replay grinding.</text>
    </g>

    <!-- Principle 3 -->
    <g transform="translate(0, 170)">
      <rect width="380" height="70" rx="8" fill="#0b172a" stroke="#a855f7" stroke-width="1.2" />
      <text x="16" y="26" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="bold">3. NEXT-DAY ARRIVAL AT MIDNIGHT</text>
      <text x="16" y="48" fill="#cbd5e1" font-family="sans-serif" font-size="11">New challenge unlocks automatically at 00:00 (EAT / UTC).</text>
      <text x="16" y="63" fill="#94a3b8" font-family="sans-serif" font-size="10">Continue defense practice in Arena or Learn Center in the meantime.</text>
    </g>
  </g>

  <!-- Bottom Navigation Row -->
  <rect x="40" y="360" width="720" height="65" rx="8" fill="#091428" stroke="#334155" stroke-width="1" />
  <text x="60" y="386" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="bold">CONTINUE DEFENSIVE TRAINING:</text>
  <text x="60" y="408" fill="#38bdf8" font-family="sans-serif" font-size="11">⚔️ Cyber Arena (18 Scenarios)  ·  🎓 Learn Center (Levels 1-6)  ·  🚀 Cyber Hero Journey (6 Missions)</text>
</svg>