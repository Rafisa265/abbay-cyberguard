<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad-m01" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="amber-alert" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <radialGradient id="radar-pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0b1329" stop-opacity="0" />
    </radialGradient>
    <!-- Glow Filters -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Navy Background -->
  <rect width="800" height="450" fill="url(#bg-grad-m01)" />

  <!-- Cyber Hex Grid Pattern -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.35">
    <path d="M 0,50 L 800,50 M 0,100 L 800,100 M 0,150 L 800,150 M 0,200 L 800,200 M 0,250 L 800,250 M 0,300 L 800,300 M 0,350 L 800,350 M 0,400 L 800,400" />
    <path d="M 100,0 L 100,450 M 200,0 L 200,450 M 300,0 L 300,450 M 400,0 L 400,450 M 500,0 L 500,450 M 600,0 L 600,450 M 700,0 L 700,450" />
  </g>

  <!-- Radar Pulse Glow -->
  <circle cx="500" cy="225" r="180" fill="url(#radar-pulse)" />
  <circle cx="500" cy="225" r="140" fill="none" stroke="#00f0ff" stroke-width="1" stroke-dasharray="4,6" opacity="0.4" />
  <circle cx="500" cy="225" r="90" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.3" />

  <!-- Digital Data Stream Lines -->
  <g stroke="#00f0ff" stroke-width="1.5" opacity="0.25">
    <path d="M 50,80 L 220,80 L 260,120 L 400,120" fill="none" />
    <circle cx="400" cy="120" r="3" fill="#00f0ff" />
    <path d="M 60,380 L 180,380 L 220,340 L 360,340" fill="none" />
    <circle cx="360" cy="340" r="3" fill="#00f0ff" />
    <path d="M 720,100 L 640,100 L 600,140 L 520,140" fill="none" />
    <circle cx="520" cy="140" r="3" fill="#00f0ff" />
  </g>

  <!-- Ethiopian Subtle Tricolor Cyber Accent Badge -->
  <g transform="translate(40, 36)" opacity="0.9">
    <rect x="0" y="0" width="120" height="24" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <rect x="8" y="7" width="10" height="10" rx="2" fill="#10b981" />
    <rect x="22" y="7" width="10" height="10" rx="2" fill="#f59e0b" />
    <rect x="36" y="7" width="10" height="10" rx="2" fill="#ef4444" />
    <text x="54" y="16" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="1">CYBERSHIELD</text>
  </g>

  <!-- Left: Holographic Cyber Shield with Scholarship Scroll -->
  <g transform="translate(180, 225)" filter="url(#neon-glow)">
    <!-- Outer Shield Crest -->
    <path d="M 0,-110 L 90,-50 L 90,40 C 90,100 0,140 0,140 C 0,140 -90,100 -90,40 L -90,-50 Z" 
          fill="#0c1733" stroke="url(#cyan-glow)" stroke-width="3" opacity="0.9" />
    
    <!-- Inner Shield Grid -->
    <path d="M 0,-90 L 70,-40 L 70,35 C 70,85 0,118 0,118 C 0,118 -70,85 -70,35 L -70,-40 Z" 
          fill="#091226" stroke="#00f0ff" stroke-width="1" stroke-dasharray="3,3" opacity="0.7" />

    <!-- Holographic Scholarship Mortarboard Icon -->
    <path d="M 0,-45 L 42,-25 L 0,-5 L -42,-25 Z" fill="#38bdf8" opacity="0.9" />
    <path d="M 0,-5 L 28,8 L 28,32 C 28,32 0,44 -28,32 L -28,8 Z" fill="#0284c7" opacity="0.8" />
    <!-- Mortarboard Tassel -->
    <path d="M 30,-11 L 38,-3 L 38,18" fill="none" stroke="#f59e0b" stroke-width="2" />
    <circle cx="38" cy="20" r="3" fill="#f59e0b" />
  </g>

  <!-- Right: Phishing Analysis Hologram & Red Flag Indicators -->
  <g transform="translate(480, 120)">
    <!-- Simulated Email / Telegram Phishing Card -->
    <rect x="0" y="0" width="260" height="160" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <rect x="0" y="0" width="260" height="32" rx="10" fill="#1e293b" />
    <circle cx="16" cy="16" r="4" fill="#ef4444" />
    <circle cx="28" cy="16" r="4" fill="#f59e0b" />
    <circle cx="40" cy="16" r="4" fill="#10b981" />
    <text x="56" y="20" fill="#cbd5e1" font-family="monospace" font-size="11">grant-notice@unverified.org</text>

    <!-- Urgent Demands Box -->
    <rect x="16" y="44" width="228" height="42" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
    <text x="26" y="60" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">⚠️ URGENT: 1,500 ETB Processing Fee</text>
    <text x="26" y="76" fill="#818cf8" font-family="monospace" font-size="9">Expires in: 01:59:42 • Direct Mobile Wallet</text>

    <!-- Phishing Link Box -->
    <rect x="16" y="96" width="228" height="48" rx="6" fill="#1c1917" stroke="url(#amber-alert)" stroke-width="1.5" />
    <text x="26" y="112" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="10" font-weight="700">🚨 PHISHING INDICATOR DETECTED</text>
    <text x="26" y="128" fill="#f87171" font-family="monospace" font-size="9">http://scholarship-ethiopia.invalid</text>
  </g>

  <!-- Target Scanning Reticle -->
  <g transform="translate(490, 320)">
    <circle cx="0" cy="0" r="28" fill="none" stroke="#00f0ff" stroke-width="2" />
    <line x1="-36" y1="0" x2="36" y2="0" stroke="#00f0ff" stroke-width="1" stroke-dasharray="2,2" />
    <line x1="0" y1="-36" x2="0" y2="36" stroke="#00f0ff" stroke-width="1" stroke-dasharray="2,2" />
    <text x="44" y="4" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700">M01 // ADVANCE-FEE INTERCEPT</text>
  </g>
</svg>
