  <g transform="translate(285, 230)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#051f38" stroke="#10b981" stroke-width="1.5"/>
    <path d="M 3 7 L 6 10 L 11 4" stroke="#10b981" stroke-width="2" fill="none"/>
    <text x="22" y="11" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#cbd5e1">INCIDENT TIMELINE</text>

    <rect x="0" y="22" width="14" height="14" rx="3" fill="#051f38" stroke="#10b981" stroke-width="1.5"/>
    <path d="M 3 29 L 6 32 L 11 26" stroke="#10b981" stroke-width="2" fill="none"/>
    <text x="22" y="33" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#cbd5e1">SUSPECT TELEMETRY</text>

    <rect x="0" y="44" width="14" height="14" rx="3" fill="#051f38" stroke="#10b981" stroke-width="1.5"/>
