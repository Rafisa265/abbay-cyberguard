  <rect x="285" y="145" width="230" height="12" rx="3" fill="#38bdf8" fill-opacity="0.4"/>
  <rect x="285" y="170" width="160" height="8" rx="2" fill="#94a3b8" fill-opacity="0.5"/>
  <rect x="285" y="186" width="200" height="8" rx="2" fill="#94a3b8" fill-opacity="0.4"/>
  <rect x="285" y="202" width="180" height="8" rx="2" fill="#94a3b8" fill-opacity="0.4"/>

