    <pattern id="gridM3" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bgM3)"/>
