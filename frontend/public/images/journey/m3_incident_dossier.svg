  <circle cx="400" cy="210" r="195" fill="url(#glowM3)"/>

  <!-- Incident Dossier Folder -->
  <path d="M 270 100 L 370 100 L 390 120 L 530 120 C 540 120 545 125 545 135 L 545 325 C 545 335 540 340 530 340 L 270 340 C 260 340 255 335 255 325 L 255 115 C 255 105 260 100 270 100 Z"
        fill="#071836" stroke="url(#blueAmberM3)" stroke-width="3" filter="url(#neonM3)"/>

