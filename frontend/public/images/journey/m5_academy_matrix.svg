<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgM5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050618"/>
      <stop offset="50%" stop-color="#110e30"/>
      <stop offset="100%" stop-color="#040414"/>
    </linearGradient>
    <linearGradient id="purpleCyanM5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="glowM5" cx="50%" cy="45%" r="42%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#050618" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonM5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="gridM5" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#8b5cf6" stroke-width="0.75" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bgM5)"/>
  <rect width="800" height="450" fill="url(#gridM5)"/>
  <circle cx="400" cy="210" r="195" fill="url(#glowM5)"/>

  <!-- Knowledge Node Network Graph -->
  <g stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.4">
    <line x1="220" y1="130" x2="320" y2="175"/>
    <line x1="320" y1="175" x2="400" y2="130"/>
    <line x1="400" y1="130" x2="480" y2="175"/>
    <line x1="480" y1="175" x2="580" y2="130"/>
    <line x1="320" y1="175" x2="400" y2="240"/>
    <line x1="480" y1="175" x2="400" y2="240"/>
    <line x1="250" y1="260" x2="320" y2="175"/>
    <line x1="550" y1="260" x2="480" y2="175"/>
  </g>

  <!-- Central Academy Cyber Crest Shield -->
  <path d="M 400 85 L 495 135 L 495 245 C 495 305 450 340 400 358 C 350 340 305 305 305 245 L 305 135 Z"
        fill="#0e1338" stroke="url(#purpleCyanM5)" stroke-width="3.5" filter="url(#neonM5)"/>

  <!-- Graduation Mortarboard & Book Cyber Crest -->
  <polygon points="400,145 445,165 400,185 355,165" fill="#8b5cf6" stroke="#c4b5fd" stroke-width="2"/>
  <path d="M 370 175 L 370 200 C 370 215 430 215 430 200 L 430 175" fill="none" stroke="#00f0ff" stroke-width="2.5"/>

  <!-- Quiz Score & Badge Trophy Center -->
  <circle cx="400" cy="250" r="28" fill="#070c24" stroke="#fbbf24" stroke-width="2.5"/>
  <text x="400" y="258" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" text-anchor="middle">🏆</text>

  <!-- Level Progress Orbit Dots -->
  <circle cx="220" cy="130" r="8" fill="#10b981"/>
  <circle cx="580" cy="130" r="8" fill="#00f0ff"/>
  <circle cx="250" cy="260" r="8" fill="#38bdf8"/>
  <circle cx="550" cy="260" r="8" fill="#ec4899"/>

  <!-- Status Bar -->
  <rect x="235" y="388" width="330" height="34" rx="17" fill="#131034" stroke="#8b5cf6" stroke-width="1.5"/>
  <circle cx="257" cy="405" r="5" fill="#8b5cf6"/>
  <text x="400" y="410" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#c4b5fd" text-anchor="middle">M5 • CYBER DEFENSE ACADEMY</text>
</svg>
