  <!-- Left Column: RED TEAM (Attack Vector) -->
  <g transform="translate(40, 75)">
    <rect width="225" height="345" rx="8" fill="#140b0e" stroke="#ef4444" stroke-width="1.5" />
    <rect x="12" y="12" width="201" height="28" rx="4" fill="#ef4444" fill-opacity="0.25" />
    <text x="24" y="31" fill="#fca5a5" font-family="sans-serif" font-size="12" font-weight="bold">🔴 RED TEAM / THREAT</text>

    <text x="16" y="65" fill="#f87171" font-family="sans-serif" font-size="11" font-weight="bold">Attack Vector Analysis:</text>
    <text x="16" y="85" fill="#cbd5e1" font-family="monospace" font-size="10">• Social Eng: Fake SMS Lottery</text>
    <text x="16" y="105" fill="#cbd5e1" font-family="monospace" font-size="10">• Impersonation: Telebirr Caller</text>
    <text x="16" y="125" fill="#cbd5e1" font-family="monospace" font-size="10">• Sideloading: Malicious APK</text>
    <text x="16" y="145" fill="#cbd5e1" font-family="monospace" font-size="10">• PrivEsc: Sudo Shell Escape</text>
    <text x="16" y="165" fill="#cbd5e1" font-family="monospace" font-size="10">• Supply Chain: Pkg Confusion</text>

    <!-- Synthetic Terminal Snippet -->
    <rect x="12" y="185" width="201" height="145" rx="6" fill="#070a12" stroke="#334155" />
    <text x="20" y="205" fill="#94a3b8" font-family="monospace" font-size="9"># Attacker Telemetry Log</text>
    <text x="20" y="222" fill="#ef4444" font-family="monospace" font-size="9">&gt; initiate_phish_lure()</text>
    <text x="20" y="239" fill="#fca5a5" font-family="monospace" font-size="9">&gt; target: regional_user</text>
    <text x="20" y="256" fill="#fca5a5" font-family="monospace" font-size="9">&gt; payload: ussd_payment</text>
    <text x="20" y="273" fill="#fca5a5" font-family="monospace" font-size="9">&gt; status: INTERCEPTED</text>
    <text x="20" y="300" fill="#34d399" font-family="monospace" font-size="9">🛡️ Blocked by Defensive Rule</text>
  </g>

  <!-- Center Column: ARENA COMBAT METER -->
  <g transform="translate(285, 75)">
    <rect width="230" height="345" rx="8" fill="#091428" stroke="#00f0ff" stroke-width="1.5" />
    <rect x="12" y="12" width="206" height="28" rx="4" fill="#00f0ff" fill-opacity="0.2" />
    <text x="28" y="31" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">⚡ COMBAT TACTICAL METERS</text>

    <!-- Shield Health Meter -->
