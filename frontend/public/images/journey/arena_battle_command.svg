    <text x="28" y="188" fill="#00f0ff" font-family="sans-serif" font-size="11" font-weight="bold">18-SCENARIO CURRICULUM</text>
    <text x="28" y="210" fill="#cbd5e1" font-family="sans-serif" font-size="10">🟢 Beginner Tier (6 Scenarios)</text>
    <text x="28" y="228" fill="#cbd5e1" font-family="sans-serif" font-size="10">🟡 Intermediate Tier (6 Scenarios)</text>
    <text x="28" y="246" fill="#cbd5e1" font-family="sans-serif" font-size="10">🔴 Advanced Tier (6 Scenarios)</text>
    <text x="28" y="275" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold">Total Rewards: 1,350 XP</text>
    <text x="28" y="295" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="bold">Fair Idempotency: Anti-Dup XP</text>
  </g>

  <!-- Right Column: BLUE TEAM (Defense Response) -->
  <g transform="translate(535, 75)">
    <rect width="225" height="345" rx="8" fill="#0b1715" stroke="#10b981" stroke-width="1.5" />
    <rect x="12" y="12" width="201" height="28" rx="4" fill="#10b981" fill-opacity="0.25" />
    <text x="24" y="31" fill="#6ee7b7" font-family="sans-serif" font-size="12" font-weight="bold">🔵 BLUE TEAM / DEFENSE</text>

    <text x="16" y="65" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold">Defensive Capabilities:</text>
    <text x="16" y="85" fill="#cbd5e1" font-family="monospace" font-size="10">• Heuristic Detection: Link Form</text>
    <text x="16" y="105" fill="#cbd5e1" font-family="monospace" font-size="10">• Identity Guard: Out-of-Band</text>
    <text x="16" y="125" fill="#cbd5e1" font-family="monospace" font-size="10">• Host Isolation: EDR Quarantine</text>
    <text x="16" y="145" fill="#cbd5e1" font-family="monospace" font-size="10">• Patch Switch: CVE Mitigation</text>
    <text x="16" y="165" fill="#cbd5e1" font-family="monospace" font-size="10">• SOC Triage: 7-Point Dossier</text>

