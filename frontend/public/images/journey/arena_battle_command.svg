    <rect x="12" y="185" width="201" height="145" rx="6" fill="#070a12" stroke="#334155" />
    <text x="20" y="205" fill="#94a3b8" font-family="monospace" font-size="9"># Defense Command Terminal</text>
    <text x="20" y="222" fill="#34d399" font-family="monospace" font-size="9">&gt; apply_containment_rule()</text>
    <text x="20" y="239" fill="#a7f3d0" font-family="monospace" font-size="9">&gt; sim_card_locked: true</text>
    <text x="20" y="256" fill="#a7f3d0" font-family="monospace" font-size="9">&gt; cve_patch_deployed: 2026-9871</text>
    <text x="20" y="273" fill="#a7f3d0" font-family="monospace" font-size="9">&gt; badge_awarded: Grandmaster</text>
    <text x="20" y="300" fill="#00f0ff" font-family="monospace" font-size="9">✓ XP Awarded: +100 XP</text>
  </g>
</svg>