    <rect x="16" y="130" width="198" height="16" rx="4" fill="#1e293b" />
    <rect x="16" y="130" width="180" height="16" rx="4" fill="#3b82f6" />
    <text x="100" y="143" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">92%</text>

    <!-- 18 Scenario Matrix Progress -->
