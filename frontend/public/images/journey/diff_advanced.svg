<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050616"/>
      <stop offset="50%" stop-color="#110d29"/>
      <stop offset="100%" stop-color="#050414"/>
    </linearGradient>
    <linearGradient id="purpleCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="45%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="44%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#050616" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#a855f7" stroke-width="0.75" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <rect width="800" height="450" fill="url(#cyberGrid)"/>
  <circle cx="400" cy="210" r="195" fill="url(#centerGlow)"/>

  <!-- Quantum Hexagon Grid Elements -->
  <polygon points="400,30 550,115 550,285 400,370 250,285 250,115" fill="none" stroke="#a855f7" stroke-width="1" stroke-dasharray="8 6" stroke-opacity="0.3"/>
  <polygon points="400,55 520,125 520,265 400,335 280,265 280,125" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="16 10" stroke-opacity="0.45"/>

  <!-- Outer Cyber Crest Shield -->
  <path d="M 400 80 L 520 130 L 520 255 C 520 325 465 365 400 385 C 335 365 280 325 280 255 L 280 130 Z"
        fill="#130e2d" stroke="url(#purpleCyanGrad)" stroke-width="4" filter="url(#neonGlow)"/>

  <!-- Inner Shield Core -->
  <path d="M 400 105 L 495 145 L 495 245 C 495 302 450 338 400 355 C 350 338 305 302 305 245 L 305 145 Z"
        fill="#09061a" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- Advanced 8-Point Cyber Star / Fortress Telemetry Core -->
  <g transform="translate(400, 215)" filter="url(#neonGlow)">
    <polygon points="0,-45 12,-15 45,0 12,15 0,45 -12,15 -45,0 -12,-15" fill="#a855f7" fill-opacity="0.4" stroke="#c084fc" stroke-width="2"/>
    <circle cx="0" cy="0" r="14" fill="#09061a" stroke="#00f0ff" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="6" fill="#00f0ff"/>
  </g>

  <!-- Node Telemetry Lines -->
  <circle cx="340" cy="165" r="5" fill="#c084fc"/>
  <circle cx="460" cy="165" r="5" fill="#c084fc"/>
  <line x1="340" y1="165" x2="385" y2="195" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="460" y1="165" x2="415" y2="195" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Tech Corner Brackets -->
  <path d="M 30 30 L 70 30 M 30 30 L 30 70" stroke="#a855f7" stroke-width="3" fill="none"/>
  <path d="M 770 30 L 730 30 M 770 30 L 770 70" stroke="#a855f7" stroke-width="3" fill="none"/>
  <path d="M 30 420 L 70 420 M 30 420 L 30 380" stroke="#a855f7" stroke-width="3" fill="none"/>
  <path d="M 770 420 L 730 420 M 770 420 L 770 380" stroke="#a855f7" stroke-width="3" fill="none"/>

  <!-- Status Bar / Label Ribbon -->
  <rect x="250" y="390" width="300" height="34" rx="17" fill="#1b1238" stroke="#a855f7" stroke-width="1.5"/>
  <circle cx="272" cy="407" r="5" fill="#c084fc"/>
  <text x="400" y="412" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#e9d5ff" text-anchor="middle">TIER 3 • ADVANCED CHAMPION</text>
</svg>
