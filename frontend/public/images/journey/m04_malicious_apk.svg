<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-m04" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050914" />
      <stop offset="50%" stop-color="#140a1c" />
      <stop offset="100%" stop-color="#0c1322" />
    </linearGradient>
    <linearGradient id="malware-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="shield-protect" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <radialGradient id="quarantine-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#050914" stop-opacity="0" />
    </radialGradient>
    <filter id="neon-glow-m04" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Navy/Purple Background -->
  <rect width="800" height="450" fill="url(#bg-grad-m04)" />

  <!-- Quarantine Hexagon Grid Field -->
  <g stroke="#3b1d38" stroke-width="1.2" opacity="0.45">
    <polygon points="260,160 300,185 300,235 260,260 220,235 220,185" fill="none" />
    <polygon points="340,160 380,185 380,235 340,260 300,235 300,185" fill="none" />
    <polygon points="260,260 300,285 300,335 260,360 220,335 220,285" fill="none" />
  </g>

  <!-- Left: Quarantined Malicious Android APK Package -->
  <g transform="translate(240, 225)">
    <circle cx="0" cy="0" r="140" fill="url(#quarantine-glow)" />

    <!-- Isometric Package Box (Rogue APK) -->
    <path d="M 0,-60 L 60,-25 L 0,10 L -60,-25 Z" fill="#2d1217" stroke="url(#malware-amber)" stroke-width="2.5" />
    <path d="M -60,-25 L 0,10 L 0,80 L -60,45 Z" fill="#1f0a0e" stroke="url(#malware-amber)" stroke-width="2.5" />
    <path d="M 60,-25 L 0,10 L 0,80 L 60,45 Z" fill="#18070b" stroke="url(#malware-amber)" stroke-width="2.5" />

    <!-- Bug / Trojan Warning Glyph on Box -->
    <circle cx="0" cy="40" r="14" fill="#ef4444" filter="url(#neon-glow-m04)" />
    <circle cx="0" cy="40" r="8" fill="#ffffff" />
    <!-- Android Antennas -->
    <line x1="-16" y1="-75" x2="-28" y2="-95" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
    <line x1="16" y1="-75" x2="28" y2="-95" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />

    <text x="0" y="115" text-anchor="middle" fill="#f87171" font-family="monospace" font-size="11" font-weight="700">ROGUE APK // ISOLATED</text>
  </g>

  <!-- Right: Play Protect Sentinel Shield Barrier -->
  <g transform="translate(540, 225)" filter="url(#neon-glow-m04)">
    <!-- Multi-Layer Sentinel Shield -->
    <path d="M 0,-105 L 85,-45 L 85,35 C 85,95 0,135 0,135 C 0,135 -85,95 -85,35 L -85,-45 Z" 
          fill="#062e24" stroke="url(#shield-protect)" stroke-width="3.5" />
    
    <!-- Inner Energy Matrix -->
    <path d="M 0,-80 L 65,-35 L 65,30 C 65,75 0,108 0,108 C 0,108 -65,75 -65,30 L -65,-35 Z" 
          fill="#022119" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,4" />

    <!-- Play Protect Checkmark Crest -->
    <path d="M -24,4 L -8,22 L 28,-18" fill="none" stroke="#22c55e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="0" cy="0" r="42" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="5,3" />
  </g>

  <!-- Threat Analysis Footer Pill -->
  <g transform="translate(60, 340)">
    <rect x="0" y="0" width="380" height="56" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="1.5" opacity="0.95" />
    <text x="16" y="24" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">🛡️ PERMISSION BYPASS BLOCKED</text>
    <text x="16" y="44" fill="#94a3b8" font-family="monospace" font-size="10">PLAY PROTECT ENFORCED • HIGH-RISK SMS EXPLOIT DENIED</text>
  </g>

  <!-- Header Badge -->
  <g transform="translate(60, 40)">
    <rect x="0" y="0" width="180" height="26" rx="4" fill="#1e1338" stroke="#a855f7" stroke-width="1" />
    <text x="12" y="17" fill="#d8b4fe" font-family="monospace" font-size="11" font-weight="700">M04 // MALWARE SENTINEL</text>
  </g>
</svg>
