<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="60%" stop-color="#0b172a" />
      <stop offset="100%" stop-color="#0f2942" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg4)" />

  <!-- Title Badge -->
  <rect x="40" y="24" width="370" height="34" rx="6" fill="#0f172a" stroke="#00f0ff" stroke-width="1.5" />
  <text x="55" y="46" fill="#00f0ff" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="1.5">DEFENSE-IN-DEPTH ARCHITECTURAL MODEL</text>
  <text x="430" y="46" fill="#94a3b8" font-family="sans-serif" font-size="13">Learn Center Level 5 &amp; 6 Mastery</text>

  <!-- Left: Concentric Shield Illustration -->
  <g transform="translate(190, 245)">
    <!-- Layer 4: Perimeter -->
    <circle r="160" fill="#0e2340" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6,4" fill-opacity="0.3" />
    <!-- Layer 3: Network -->
    <circle r="125" fill="#0a324a" stroke="#00f0ff" stroke-width="1.8" fill-opacity="0.4" />
    <!-- Layer 2: Host & EDR -->
    <circle r="90" fill="#0b4344" stroke="#10b981" stroke-width="2" fill-opacity="0.5" />
    <!-- Layer 1: Data & Identity (Core) -->
    <circle r="55" fill="#1b4d3e" stroke="#34d399" stroke-width="2.5" />
    <text x="0" y="6" text-anchor="middle" fill="#a7f3d0" font-family="sans-serif" font-size="12" font-weight="bold">ZERO TRUST</text>
    <text x="0" y="22" text-anchor="middle" fill="#6ee7b7" font-family="sans-serif" font-size="10">IDENTITY CORE</text>
  </g>

  <!-- Right: Layer Breakdown Cards -->
  <g transform="translate(400, 75)">
    <!-- Layer 4 Card -->
    <g transform="translate(0, 0)">
      <rect width="360" height="70" rx="8" fill="#0c192e" stroke="#3b82f6" stroke-width="1.2" />
      <text x="16" y="24" fill="#60a5fa" font-family="sans-serif" font-size="12" font-weight="bold">LAYER 4: PERIMETER &amp; DNS SECURITY</text>
      <text x="16" y="44" fill="#cbd5e1" font-family="sans-serif" font-size="11">• DNS filtering, DDoS scrubbing, Heuristic link scanning (M1)</text>
      <text x="16" y="59" fill="#94a3b8" font-family="sans-serif" font-size="10">Blocks known malicious hosts before TCP connection</text>
    </g>

    <!-- Layer 3 Card -->
    <g transform="translate(0, 85)">
      <rect width="360" height="70" rx="8" fill="#082236" stroke="#00f0ff" stroke-width="1.2" />
      <text x="16" y="24" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">LAYER 3: NETWORK &amp; TLS ENCRYPTION</text>
      <text x="16" y="44" fill="#cbd5e1" font-family="sans-serif" font-size="11">• TLS 1.3, Strict Transport Security (HSTS), Micro-segmentation</text>
      <text x="16" y="59" fill="#94a3b8" font-family="sans-serif" font-size="10">Prevents on-path MITM interception and lateral traversal</text>
    </g>

    <!-- Layer 2 Card -->
    <g transform="translate(0, 170)">
      <rect width="360" height="70" rx="8" fill="#082b2d" stroke="#10b981" stroke-width="1.2" />
      <text x="16" y="24" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="bold">LAYER 2: HOST, EDR &amp; APPLICATION HYGIENE</text>
      <text x="16" y="44" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Content-Security-Policy (CSP), Script Sandboxing, Host EDR</text>
      <text x="16" y="59" fill="#94a3b8" font-family="sans-serif" font-size="10">Terminates unauthorized process execution &amp; script injection</text>
    </g>

    <!-- Layer 1 Card -->
    <g transform="translate(0, 255)">
      <rect width="360" height="70" rx="8" fill="#0a382c" stroke="#34d399" stroke-width="1.5" />
      <text x="16" y="24" fill="#6ee7b7" font-family="sans-serif" font-size="12" font-weight="bold">LAYER 1: IDENTITY, LEAST PRIVILEGE &amp; DATA</text>
      <text x="16" y="44" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Multi-Factor Authentication (2FA), High-Entropy Passphrases (M2)</text>
      <text x="16" y="59" fill="#94a3b8" font-family="sans-serif" font-size="10">Ensures compromised perimeter never grants unauthenticated data access</text>
    </g>
  </g>

  <!-- Bottom Insight -->
  <rect x="40" y="390" width="720" height="42" rx="6" fill="#0c172a" stroke="#475569" />
  <text x="60" y="415" fill="#cbd5e1" font-family="sans-serif" font-size="11">PRINCIPLE: If one defensive layer fails, subsequent independent layers contain the breach and protect core assets.</text>
</svg>