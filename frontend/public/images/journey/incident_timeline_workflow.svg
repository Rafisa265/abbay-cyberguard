<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a17" />
      <stop offset="100%" stop-color="#0c1730" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg3)" />

  <!-- Title Badge -->
  <rect x="40" y="24" width="380" height="34" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
  <text x="55" y="46" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="1.5">CYBERSHIELD 7-STAGE INCIDENT WORKFLOW</text>
  <text x="440" y="46" fill="#94a3b8" font-family="sans-serif" font-size="13">Module M3 Evidence &amp; Escalation</text>

  <!-- 7-Stage Flowchart Cards -->
  <!-- Row 1: Steps 1 - 4 -->
  <!-- Step 1 -->
  <g transform="translate(40, 75)">
    <rect width="165" height="115" rx="8" fill="#0f1c36" stroke="#ef4444" stroke-width="1.5" />
    <circle cx="28" cy="28" r="14" fill="#ef4444" fill-opacity="0.2" />
    <text x="23" y="33" fill="#fca5a5" font-family="monospace" font-size="13" font-weight="bold">1</text>
    <text x="50" y="32" fill="#ef4444" font-family="sans-serif" font-size="12" font-weight="bold">Triage &amp; Detect</text>
    <text x="14" y="60" fill="#94a3b8" font-family="sans-serif" font-size="10">Recognize scam SMS,</text>
    <text x="14" y="76" fill="#94a3b8" font-family="sans-serif" font-size="10">phishing email, or rogue</text>
    <text x="14" y="92" fill="#94a3b8" font-family="sans-serif" font-size="10">mobile money prompt.</text>
  </g>
  <path d="M 205,132 L 225,132" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 2 -->
  <g transform="translate(225, 75)">
    <rect width="165" height="115" rx="8" fill="#0f1c36" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="28" cy="28" r="14" fill="#f59e0b" fill-opacity="0.2" />
    <text x="23" y="33" fill="#fde68a" font-family="monospace" font-size="13" font-weight="bold">2</text>
    <text x="50" y="32" fill="#f59e0b" font-family="sans-serif" font-size="12" font-weight="bold">Containment</text>
    <text x="14" y="60" fill="#94a3b8" font-family="sans-serif" font-size="10">Freeze digital wallet,</text>
    <text x="14" y="76" fill="#94a3b8" font-family="sans-serif" font-size="10">lock SIM with telecom,</text>
    <text x="14" y="92" fill="#94a3b8" font-family="sans-serif" font-size="10">disconnect network.</text>
  </g>
  <path d="M 390,132 L 410,132" stroke="#38bdf8" stroke-width="2" />

  <!-- Step 3 -->
  <g transform="translate(410, 75)">
    <rect width="165" height="115" rx="8" fill="#0f1c36" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="28" cy="28" r="14" fill="#38bdf8" fill-opacity="0.2" />
    <text x="23" y="33" fill="#bae6fd" font-family="monospace" font-size="13" font-weight="bold">3</text>
    <text x="50" y="32" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">Evidence Collect</text>
    <text x="14" y="60" fill="#94a3b8" font-family="sans-serif" font-size="10">Capture screenshots,</text>
    <text x="14" y="76" fill="#94a3b8" font-family="sans-serif" font-size="10">transaction reference IDs,</text>
    <text x="14" y="92" fill="#94a3b8" font-family="sans-serif" font-size="10">suspect phone numbers.</text>
  </g>
  <path d="M 575,132 L 595,132" stroke="#38bdf8" stroke-width="2" />

  <!-- Step 4 -->
  <g transform="translate(595, 75)">
    <rect width="165" height="115" rx="8" fill="#0f1c36" stroke="#a855f7" stroke-width="1.5" />
    <circle cx="28" cy="28" r="14" fill="#a855f7" fill-opacity="0.2" />
    <text x="23" y="33" fill="#e9d5ff" font-family="monospace" font-size="13" font-weight="bold">4</text>
    <text x="50" y="32" fill="#a855f7" font-family="sans-serif" font-size="12" font-weight="bold">Impact Scope</text>
    <text x="14" y="60" fill="#94a3b8" font-family="sans-serif" font-size="10">Calculate ETB exposure,</text>
    <text x="14" y="76" fill="#94a3b8" font-family="sans-serif" font-size="10">identify affected devices</text>
    <text x="14" y="92" fill="#94a3b8" font-family="sans-serif" font-size="10">and compromised apps.</text>
  </g>

  <!-- Connector Line from Row 1 to Row 2 -->
  <path d="M 677,190 L 677,215 L 122,215 L 122,240" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" />

  <!-- Row 2: Steps 5 - 7 -->
  <!-- Step 5 -->
  <g transform="translate(40, 240)">
    <rect width="220" height="115" rx="8" fill="#0f1c36" stroke="#00f0ff" stroke-width="1.5" />
    <circle cx="28" cy="28" r="14" fill="#00f0ff" fill-opacity="0.2" />
    <text x="23" y="33" fill="#a5f3fc" font-family="monospace" font-size="13" font-weight="bold">5</text>
    <text x="50" y="32" fill="#00f0ff" font-family="sans-serif" font-size="12" font-weight="bold">Module M3 Dossier Draft</text>
    <text x="14" y="60" fill="#cbd5e1" font-family="sans-serif" font-size="10">• Assemble structured 7-point summary</text>
    <text x="14" y="76" fill="#cbd5e1" font-family="sans-serif" font-size="10">• Zero passwords / PINs included (Safe)</text>
    <text x="14" y="92" fill="#cbd5e1" font-family="sans-serif" font-size="10">• Export formatted text / PDF locally</text>
  </g>
  <path d="M 260,297 L 290,297" stroke="#38bdf8" stroke-width="2" />

  <!-- Step 6 -->
  <g transform="translate(290, 240)">
    <rect width="220" height="115" rx="8" fill="#0f1c36" stroke="#10b981" stroke-width="1.5" />
    <circle cx="28" cy="28" r="14" fill="#10b981" fill-opacity="0.2" />
    <text x="23" y="33" fill="#6ee7b7" font-family="monospace" font-size="13" font-weight="bold">6</text>
    <text x="50" y="32" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="bold">Authority Escalation</text>
    <text x="14" y="60" fill="#cbd5e1" font-family="sans-serif" font-size="10">• INSA / CERT-ET Hotline: 933</text>
    <text x="14" y="76" fill="#cbd5e1" font-family="sans-serif" font-size="10">• CBE Fraud Line: 951 / Ethio: 994</text>
    <text x="14" y="92" fill="#cbd5e1" font-family="sans-serif" font-size="10">• Federal Police Cyber Crime: 991</text>
  </g>
  <path d="M 510,297 L 540,297" stroke="#38bdf8" stroke-width="2" />

  <!-- Step 7 -->
  <g transform="translate(540, 240)">
    <rect width="220" height="115" rx="8" fill="#0f1c36" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="28" cy="28" r="14" fill="#3b82f6" fill-opacity="0.2" />
    <text x="23" y="33" fill="#93c5fd" font-family="monospace" font-size="13" font-weight="bold">7</text>
    <text x="50" y="32" fill="#3b82f6" font-family="sans-serif" font-size="12" font-weight="bold">Hardening &amp; Recovery</text>
    <text x="14" y="60" fill="#cbd5e1" font-family="sans-serif" font-size="10">• Rotate passphrases in M2</text>
    <text x="14" y="76" fill="#cbd5e1" font-family="sans-serif" font-size="10">• Re-enable 2FA on fresh accounts</text>
    <text x="14" y="92" fill="#cbd5e1" font-family="sans-serif" font-size="10">• Complete Cyber Hero simulation</text>
  </g>

  <!-- Bottom Privacy Bar -->
  <rect x="40" y="375" width="720" height="55" rx="6" fill="#180e12" stroke="#ef4444" stroke-width="1.2" />
  <text x="60" y="398" fill="#f87171" font-family="sans-serif" font-size="12" font-weight="bold">⚠️ MANDATORY PRIVACY SAFEGUARD (SR-07 / FR-19):</text>
  <text x="60" y="416" fill="#cbd5e1" font-family="sans-serif" font-size="11">Never enter passwords, banking PINs, OTP codes, or full debit/credit card numbers into your incident report.</text>
</svg>