    <!-- Golden Shield Path -->
    <path d="M 0,-90 L 75,-40 C 75,50 40,95 0,115 C -40,95 -75,50 -75,-40 Z" fill="#131e3a" stroke="url(#gold-grad)" stroke-width="3" />

    <!-- Inner Shield Star -->
    <polygon points="0,-35 10,-8 35,-8 15,8 22,35 0,20 -22,35 -15,8 -35,-8 -10,-8" fill="url(#gold-grad)" />

    <!-- 18 Mastered Scenario Stars -->
    <g fill="#fde047" font-size="11">
