  <text x="400" y="405" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">All 18 Attack, Defense, and Battle Scenarios Mastered · 1,350 Total Arena XP</text>
  <text x="400" y="425" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">Unlocked badge_arena_grandmaster · Ready for Advanced Cyber Hero Journey Missions</text>
