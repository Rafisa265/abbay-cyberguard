      <circle cx="-35" cy="-70" r="3.5" />
      <circle cx="-15" cy="-80" r="3.5" />
      <circle cx="15" cy="-80" r="3.5" />
      <circle cx="35" cy="-70" r="3.5" />
      <circle cx="50" cy="-55" r="3.5" />

      <circle cx="-65" cy="-30" r="3.5" />
      <circle cx="-65" cy="-5" r="3.5" />
      <circle cx="-60" cy="20" r="3.5" />
      <circle cx="-45" cy="45" r="3.5" />
      <circle cx="-25" cy="65" r="3.5" />
      <circle cx="0" cy="75" r="3.5" />

      <circle cx="25" cy="65" r="3.5" />
      <circle cx="45" cy="45" r="3.5" />
      <circle cx="60" cy="20" r="3.5" />
      <circle cx="65" cy="-5" r="3.5" />
      <circle cx="65" cy="-30" r="3.5" />
