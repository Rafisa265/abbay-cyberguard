<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030814"/>
      <stop offset="50%" stop-color="#081730"/>
      <stop offset="100%" stop-color="#020914"/>
    </linearGradient>
    <linearGradient id="cyberMeshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="matrixGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#030814" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="matrixGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#00f0ff" stroke-width="0.75" stroke-opacity="0.12"/>
      <circle cx="0" cy="0" r="1.5" fill="#00f0ff" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <rect width="800" height="450" fill="url(#matrixGrid)"/>
  <circle cx="400" cy="205" r="200" fill="url(#matrixGlow)"/>

  <!-- Neural Mesh Connections -->
  <g stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.35">
    <line x1="240" y1="120" x2="330" y2="170"/>
    <line x1="330" y1="170" x2="400" y2="120"/>
    <line x1="400" y1="120" x2="470" y2="170"/>
    <line x1="470" y1="170" x2="560" y2="120"/>
    <line x1="240" y1="120" x2="260" y2="240"/>
    <line x1="260" y1="240" x2="330" y2="280"/>
    <line x1="330" y1="280" x2="400" y2="250"/>
    <line x1="400" y1="250" x2="470" y2="280"/>
    <line x1="470" y1="280" x2="540" y2="240"/>
    <line x1="540" y1="240" x2="560" y2="120"/>
    <line x1="330" y1="170" x2="400" y2="205"/>
    <line x1="470" y1="170" x2="400" y2="205"/>
    <line x1="330" y1="280" x2="400" y2="205"/>
    <line x1="470" y1="280" x2="400" y2="205"/>
  </g>

  <!-- Neural Nodes -->
  <circle cx="240" cy="120" r="5" fill="#38bdf8"/>
  <circle cx="560" cy="120" r="5" fill="#38bdf8"/>
  <circle cx="260" cy="240" r="5" fill="#38bdf8"/>
  <circle cx="540" cy="240" r="5" fill="#38bdf8"/>
  <circle cx="330" cy="170" r="6" fill="#00f0ff"/>
  <circle cx="470" cy="170" r="6" fill="#00f0ff"/>
  <circle cx="400" cy="120" r="6" fill="#818cf8"/>
  <circle cx="330" cy="280" r="6" fill="#818cf8"/>
  <circle cx="470" cy="280" r="6" fill="#818cf8"/>
  <circle cx="400" cy="250" r="6" fill="#00f0ff"/>

  <!-- Central Adaptive AI Core -->
  <circle cx="400" cy="205" r="58" fill="#071b36" stroke="url(#cyberMeshGrad)" stroke-width="3.5" filter="url(#neonGlow)"/>
  <circle cx="400" cy="205" r="42" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="10 6"/>

  <!-- Rotating Cyberspace Ring Nodes -->
  <circle cx="400" cy="205" r="22" fill="#0c2d58" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="400" cy="205" r="9" fill="#00f0ff"/>

  <!-- Digital Wave Pulse Waves -->
  <path d="M 120 205 Q 160 175 200 205 T 280 205" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.3"/>
  <path d="M 520 205 Q 560 175 600 205 T 680 205" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Ethiopian Cyber Accent: Diamond Chevron Header -->
  <path d="M 370 45 L 400 30 L 430 45" fill="none" stroke="#00f0ff" stroke-width="2"/>
  <circle cx="400" cy="30" r="3" fill="#00f0ff"/>

  <!-- Tech Corner Brackets -->
  <path d="M 30 30 L 70 30 M 30 30 L 30 70" stroke="#00f0ff" stroke-width="3" fill="none"/>
  <path d="M 770 30 L 730 30 M 770 30 L 770 70" stroke="#00f0ff" stroke-width="3" fill="none"/>
  <path d="M 30 420 L 70 420 M 30 420 L 30 380" stroke="#00f0ff" stroke-width="3" fill="none"/>
  <path d="M 770 420 L 730 420 M 770 420 L 770 380" stroke="#00f0ff" stroke-width="3" fill="none"/>

  <!-- Status Bar / Label Ribbon -->
  <rect x="235" y="388" width="330" height="34" rx="17" fill="#061b34" stroke="#00f0ff" stroke-width="1.5"/>
  <circle cx="257" cy="405" r="5" fill="#00f0ff"/>
  <text x="400" y="410" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#38bdf8" text-anchor="middle">OFFLINE ADAPTIVE TRAINING MATRIX</text>
</svg>
