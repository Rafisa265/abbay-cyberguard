<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040816" />
      <stop offset="100%" stop-color="#091830" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg5)" />

  <!-- Title Badge -->
  <rect x="40" y="24" width="370" height="34" rx="6" fill="#0f172a" stroke="#00f0ff" stroke-width="1.5" />
  <text x="55" y="46" fill="#00f0ff" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="1.5">WEB APPLICATION SECURITY &amp; TLS 1.3</text>
  <text x="430" y="46" fill="#94a3b8" font-family="sans-serif" font-size="13">Module M4 Simulated Security Audit</text>

  <!-- Left: Client Browser -->
  <g transform="translate(60, 110)">
    <rect width="180" height="200" rx="10" fill="#0d1b33" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="12" y="12" width="156" height="24" rx="4" fill="#081020" stroke="#334155" />
    <circle cx="24" cy="24" r="4" fill="#ef4444" />
    <circle cx="36" cy="24" r="4" fill="#f59e0b" />
    <circle cx="48" cy="24" r="4" fill="#10b981" />
    <text x="65" y="28" fill="#94a3b8" font-family="monospace" font-size="9">https://client.et</text>

    <text x="20" y="70" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">Client Browser</text>
    <text x="20" y="90" fill="#94a3b8" font-family="sans-serif" font-size="11">• ECDHE Keygen</text>
    <text x="20" y="110" fill="#94a3b8" font-family="sans-serif" font-size="11">• CSP Enforcement</text>
    <text x="20" y="130" fill="#94a3b8" font-family="sans-serif" font-size="11">• Cookie Strict</text>
    <text x="20" y="150" fill="#94a3b8" font-family="sans-serif" font-size="11">• HSTS Preload</text>
    <rect x="20" y="165" width="140" height="24" rx="4" fill="#10b981" fill-opacity="0.2" />
    <text x="32" y="181" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="bold">🔒 SECURE CLIENT</text>
  </g>

  <!-- Middle: Cryptographic Tunnel -->
  <g transform="translate(255, 150)">
    <rect width="290" height="120" rx="8" fill="#082038" stroke="#00f0ff" stroke-width="1.8" />
    <text x="25" y="30" fill="#00f0ff" font-family="sans-serif" font-size="12" font-weight="bold">🔐 TLS 1.3 ENCRYPTED CHANNEL</text>
    <text x="25" y="52" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Cipher: ChaCha20-Poly1305 / AES-256-GCM</text>
    <text x="25" y="72" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Forward Secrecy: Ephemeral Diffie-Hellman</text>
    <text x="25" y="92" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Strict Zero-Round Trip Time (0-RTT) Replay Safe</text>

    <!-- Bidirectional flow arrows -->
    <path d="M -12,60 L 5,60" stroke="#00f0ff" stroke-width="2" />
    <path d="M 285,60 L 302,60" stroke="#00f0ff" stroke-width="2" />
  </g>

  <!-- Right: Origin Server -->
  <g transform="translate(560, 110)">
    <rect width="180" height="200" rx="10" fill="#0d1b33" stroke="#10b981" stroke-width="1.5" />
    <rect x="12" y="12" width="156" height="24" rx="4" fill="#081020" stroke="#334155" />
    <text x="25" y="28" fill="#34d399" font-family="monospace" font-size="9">BANKING ORIGIN SRV</text>

    <text x="20" y="70" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="bold">Origin Gateway</text>
    <text x="20" y="90" fill="#94a3b8" font-family="sans-serif" font-size="11">• Valid CA Certificate</text>
    <text x="20" y="110" fill="#94a3b8" font-family="sans-serif" font-size="11">• HSTS: max-age=31536000</text>
    <text x="20" y="130" fill="#94a3b8" font-family="sans-serif" font-size="11">• X-Frame: DENY</text>
    <text x="20" y="150" fill="#94a3b8" font-family="sans-serif" font-size="11">• CSP: script-src 'self'</text>
    <rect x="20" y="165" width="140" height="24" rx="4" fill="#3b82f6" fill-opacity="0.2" />
    <text x="32" y="181" fill="#93c5fd" font-family="sans-serif" font-size="10" font-weight="bold">🛡️ HARDENED HEADERS</text>
  </g>

  <!-- Bottom 3 Crucial Defensive Headers in M4 -->
  <g transform="translate(40, 335)">
    <rect width="225" height="85" rx="6" fill="#0a182c" stroke="#38bdf8" stroke-width="1.2" />
    <text x="12" y="24" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">1. HSTS (RFC 6797)</text>
    <text x="12" y="44" fill="#cbd5e1" font-family="sans-serif" font-size="10">Forces HTTPS connection;</text>
    <text x="12" y="60" fill="#cbd5e1" font-family="sans-serif" font-size="10">prevents SSL stripping attacks.</text>
    <text x="12" y="74" fill="#34d399" font-family="monospace" font-size="9">✓ Included in M4 check</text>

    <rect x="245" y="0" width="225" height="85" rx="6" fill="#0a182c" stroke="#00f0ff" stroke-width="1.2" />
    <text x="257" y="24" fill="#00f0ff" font-family="sans-serif" font-size="11" font-weight="bold">2. CSP (Content Security)</text>
    <text x="257" y="44" fill="#cbd5e1" font-family="sans-serif" font-size="10">Restricts script origins;</text>
    <text x="257" y="60" fill="#cbd5e1" font-family="sans-serif" font-size="10">neutralizes XSS payloads.</text>
    <text x="257" y="74" fill="#34d399" font-family="monospace" font-size="9">✓ Evaluated offline</text>

    <rect x="495" y="0" width="225" height="85" rx="6" fill="#0a182c" stroke="#10b981" stroke-width="1.2" />
    <text x="507" y="24" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold">3. X-Frame-Options (RFC 7034)</text>
    <text x="507" y="44" fill="#cbd5e1" font-family="sans-serif" font-size="10">DENY or SAMEORIGIN prevents</text>
    <text x="507" y="60" fill="#cbd5e1" font-family="sans-serif" font-size="10">Clickjacking iframe overlay.</text>
    <text x="507" y="74" fill="#34d399" font-family="monospace" font-size="9">✓ Standard defensive rule</text>
  </g>
</svg>