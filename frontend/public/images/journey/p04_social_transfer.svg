<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgP04" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050616"/>
      <stop offset="50%" stop-color="#120c2b"/>
      <stop offset="100%" stop-color="#040412"/>
    </linearGradient>
    <linearGradient id="roseCyanP04" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <radialGradient id="glowP04" cx="50%" cy="45%" r="42%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#050616" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonP04" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="gridP04" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#a855f7" stroke-width="0.75" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bgP04)"/>
  <rect width="800" height="450" fill="url(#gridP04)"/>
  <circle cx="400" cy="210" r="195" fill="url(#glowP04)"/>

  <!-- Audio Waveform Telemetry (Urgent Call Simulation) -->
  <g stroke="#f43f5e" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <line x1="120" y1="210" x2="120" y2="230"/>
    <line x1="140" y1="195" x2="140" y2="245"/>
    <line x1="160" y1="180" x2="160" y2="260"/>
    <line x1="180" y1="200" x2="180" y2="240"/>
    <line x1="200" y1="205" x2="200" y2="235"/>
    <line x1="600" y1="205" x2="600" y2="235"/>
    <line x1="620" y1="200" x2="620" y2="240"/>
    <line x1="640" y1="180" x2="640" y2="260"/>
    <line x1="660" y1="195" x2="660" y2="245"/>
    <line x1="680" y1="210" x2="680" y2="230"/>
  </g>

  <!-- Mobile Screen / SMS & Call HUD -->
  <rect x="270" y="75" width="260" height="280" rx="20" fill="#0c0e2a" stroke="url(#roseCyanP04)" stroke-width="3" filter="url(#neonP04)"/>
  <rect x="360" y="85" width="80" height="8" rx="4" fill="#1e1b4b"/>

  <!-- Incoming Call Pill -->
  <rect x="290" y="105" width="220" height="40" rx="10" fill="#1f1338" stroke="#f43f5e" stroke-width="1.5"/>
  <circle cx="310" cy="125" r="8" fill="#f43f5e"/>
  <text x="330" y="122" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#fda4af">+25192233XXXX</text>
  <text x="330" y="136" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8">Urgent Crying Pretext...</text>

  <!-- Fake Transfer Alert Bubble -->
  <rect x="290" y="160" width="220" height="75" rx="10" fill="#081836" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="305" y="180" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#38bdf8">SMS TRANSFER ALERT</text>
  <text x="305" y="200" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#f43f5e">2,500.00 ETB</text>
  <text x="305" y="222" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8">Personal 10-digit number sender</text>

  <!-- Official Provider USSD Shield -->
  <g transform="translate(400, 280)">
    <circle cx="0" cy="0" r="26" fill="#041224" stroke="#10b981" stroke-width="2.5"/>
    <text x="0" y="5" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" fill="#10b981" text-anchor="middle">*127#</text>
  </g>

  <!-- Status Bar -->
  <rect x="235" y="388" width="330" height="34" rx="17" fill="#180e34" stroke="#ec4899" stroke-width="1.5"/>
  <circle cx="257" cy="405" r="5" fill="#ec4899"/>
  <text x="400" y="410" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#fda4af" text-anchor="middle">SOCIAL ENGINEERING DEFENSE SHIELD</text>
</svg>
