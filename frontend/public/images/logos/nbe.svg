<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="nbeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="nbePillar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Central Bank Regulatory Seal -->
  <circle cx="50" cy="50" r="46" fill="url(#nbeGold)" stroke="#d97706" stroke-width="3" />
  <circle cx="50" cy="50" r="41" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="2,2" />
  
  <!-- Classical Central Bank Pediment & Columns -->
  <path d="M 26 36 L 50 22 L 74 36 Z" fill="url(#nbePillar)" />
  <rect x="24" y="36" width="52" height="4" rx="1" fill="#fbbf24" />
  
  <!-- Four Pillars of Monetary Stability -->
  <rect x="28" y="42" width="6" height="24" rx="1" fill="url(#nbePillar)" />
  <rect x="40" y="42" width="6" height="24" rx="1" fill="url(#nbePillar)" />
  <rect x="54" y="42" width="6" height="24" rx="1" fill="url(#nbePillar)" />
  <rect x="66" y="42" width="6" height="24" rx="1" fill="url(#nbePillar)" />
  
  <!-- Base Plinth -->
  <rect x="22" y="68" width="56" height="5" rx="1" fill="#fbbf24" />
  <rect x="18" y="74" width="64" height="4" rx="1" fill="#d97706" />
  
  <!-- NBE Acronym -->
  <text x="50" y="88" font-family="system-ui, sans-serif" font-size="7" font-weight="900" fill="#fef3c7" text-anchor="middle" letter-spacing="1">NBE • ማዕከላዊ ባንክ</text>
</svg>

