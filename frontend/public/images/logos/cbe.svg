<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" aria-label="Commercial Bank of Ethiopia (CBE) Logo">
  <defs>
    <linearGradient id="cbe-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#DAA520"/>
    </linearGradient>
  </defs>
  <!-- CBE Royal Purple Octagon / Shield -->
  <polygon points="14,2 34,2 46,14 46,34 34,46 14,46 2,34 2,14" fill="#3D1152" stroke="#DAA520" stroke-width="2"/>
  <!-- Central Scales of Justice Emblem -->
  <path d="M24 8v28M18 36h12" stroke="url(#cbe-gold)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Balance Beam -->
  <path d="M12 14h24" stroke="url(#cbe-gold)" stroke-width="2" stroke-linecap="round"/>
  <!-- Left Scale Pan -->
  <path d="M12 14l-4 8h8z" fill="none" stroke="url(#cbe-gold)" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Right Scale Pan -->
  <path d="M36 14l-4 8h8z" fill="none" stroke="url(#cbe-gold)" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="24" cy="8" r="2.5" fill="url(#cbe-gold)"/>
</svg>
