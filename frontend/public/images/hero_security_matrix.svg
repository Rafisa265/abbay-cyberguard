<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" width="100%" height="100%" fill="none" role="img" aria-label="CyberShield Security Matrix Visual">
  <defs>
    <!-- Background Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#14B8A6" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#0B1F3A" stop-opacity="0" />
    </radialGradient>

    <!-- Shield Face Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#102A43" />
      <stop offset="50%" stop-color="#0B1F3A" />
      <stop offset="100%" stop-color="#061325" />
    </linearGradient>

    <!-- Cyan Highlight Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4B942" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Orb Pulse Gradient -->
    <radialGradient id="coreOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#22D3EE" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#14B8A6" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#0B1F3A" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes shieldFloatMotion {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-7px) rotate(0.4deg); }
      }
      @keyframes orbitRotateCW {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes orbitRotateCCW {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      @keyframes circuitStreamDash {
        0% { stroke-dashoffset: 40; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes nodePulseGlow {
        0%, 100% { opacity: 0.8; filter: drop-shadow(0 0 2px #22D3EE); }
        50% { opacity: 1; filter: drop-shadow(0 0 7px #22D3EE); }
      }
      @keyframes coreOrbBreathe {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 10px #22D3EE); }
      }
      @keyframes radarSweep {
        0%, 100% { opacity: 0.18; }
        50% { opacity: 0.42; }
      }
      .shield-floating-group {
        transform-origin: 210px 180px;
        animation: shieldFloatMotion 5s ease-in-out infinite;
      }
      .orbit-cw {
        transform-origin: 210px 180px;
        animation: orbitRotateCW 32s linear infinite;
      }
      .orbit-ccw {
        transform-origin: 210px 180px;
        animation: orbitRotateCCW 44s linear infinite;
      }
      .circuit-stream {
        stroke-dasharray: 8 6;
        animation: circuitStreamDash 2.8s linear infinite;
      }
      .circuit-stream-rev {
        stroke-dasharray: 6 8;
        animation: circuitStreamDash 3.6s linear infinite reverse;
      }
      .pulse-node {
        animation: nodePulseGlow 2.6s ease-in-out infinite;
      }
      .pulse-node-cyan {
        animation: nodePulseGlow 2.4s ease-in-out infinite;
      }
      .pulse-node-teal {
        animation: nodePulseGlow 3.2s ease-in-out infinite 0.6s;
      }
      .pulse-node-gold {
        animation: nodePulseGlow 2.8s ease-in-out infinite 1.2s;
      }
      .core-orb-pulse {
        transform-origin: 210px 180px;
        animation: coreOrbBreathe 3.4s ease-in-out infinite;
      }
      .radar-ring {
        animation: radarSweep 4s ease-in-out infinite alternate;
      }
      @media (prefers-reduced-motion: reduce) {
        .shield-floating-group,
        .orbit-cw,
        .orbit-ccw,
        .circuit-stream,
        .circuit-stream-rev,
        .pulse-node,
        .pulse-node-cyan,
        .pulse-node-teal,
        .pulse-node-gold,
        .core-orb-pulse,
        .radar-ring {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Ambient Glow Behind Shield -->
  <circle cx="210" cy="180" r="170" fill="url(#bgGlow)" />

  <!-- Outer Concentric Orbit Rings (Radar / Defense Perimeter) -->
  <g class="orbit-cw">
    <circle cx="210" cy="180" r="160" stroke="#22D3EE" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="4 8" class="radar-ring" />
    <circle cx="210" cy="180" r="100" stroke="#22D3EE" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="8 6" />
  </g>
  <g class="orbit-ccw">
    <circle cx="210" cy="180" r="130" stroke="#14B8A6" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="6 10" />
  </g>

  <!-- Network Circuit Lines & Flowing Pathways -->
  <path d="M50 180 H 120 L 150 210" stroke="#22D3EE" stroke-opacity="0.4" stroke-width="1.5" class="circuit-stream" />
  <path d="M370 180 H 300 L 270 210" stroke="#22D3EE" stroke-opacity="0.4" stroke-width="1.5" class="circuit-stream-rev" />
  <path d="M210 20 V 70" stroke="#14B8A6" stroke-opacity="0.45" stroke-width="1.5" class="circuit-stream" />
  <path d="M210 320 V 360" stroke="#14B8A6" stroke-opacity="0.35" stroke-width="1.5" class="circuit-stream-rev" />
  <path d="M90 90 L 140 130" stroke="#22D3EE" stroke-opacity="0.3" stroke-width="1.5" class="circuit-stream" />
  <path d="M330 90 L 280 130" stroke="#22D3EE" stroke-opacity="0.3" stroke-width="1.5" class="circuit-stream-rev" />

  <!-- Connected Network Defense Nodes -->
  <circle cx="50" cy="180" r="4.5" fill="#22D3EE" class="pulse-node-cyan" filter="url(#glow)" />
  <circle cx="370" cy="180" r="4.5" fill="#22D3EE" class="pulse-node-cyan" filter="url(#glow)" />
  <circle cx="90" cy="90" r="4" fill="#14B8A6" class="pulse-node-teal" />
  <circle cx="330" cy="90" r="4" fill="#14B8A6" class="pulse-node-teal" />
  <circle cx="210" cy="20" r="4.5" fill="#F4B942" class="pulse-node-gold" filter="url(#glow)" />
  <circle cx="210" cy="360" r="3.5" fill="#14B8A6" class="pulse-node-teal" />

  <!-- Main Cyber Shield Body -->
  <g class="shield-floating-group">
    <!-- Outer Shield Border Glow -->
    <path d="M 210 75
             C 275 75, 315 95, 315 155
             C 315 235, 255 285, 210 305
             C 165 285, 105 235, 105 155
             C 105 95, 145 75, 210 75 Z"
          fill="url(#shieldGrad)"
          stroke="url(#cyanGrad)"
          stroke-width="3"
          filter="url(#glow)" />

    <!-- Inner Shield Inset Layer -->
    <path d="M 210 92
             C 260 92, 296 108, 296 158
             C 296 222, 246 265, 210 284
             C 174 265, 124 222, 124 158
             C 124 108, 160 92, 210 92 Z"
          fill="#0B1F3A"
          fill-opacity="0.88"
          stroke="#14B8A6"
          stroke-opacity="0.55"
          stroke-width="1.5" />

    <!-- Ethiopian Heritage Tri-Color Defense Accent Marks (Green, Gold, Red) -->
    <g transform="translate(182, 106)">
      <rect x="0" y="0" width="16" height="3" rx="1.5" fill="#14B8A6" />
      <rect x="20" y="0" width="16" height="3" rx="1.5" fill="#F4B942" />
      <rect x="40" y="0" width="16" height="3" rx="1.5" fill="#F43F5E" />
    </g>

    <!-- Central Security Core Orb -->
    <circle cx="210" cy="180" r="42" fill="url(#coreOrb)" class="core-orb-pulse" />
    <circle cx="210" cy="180" r="26" fill="#0B1F3A" stroke="#22D3EE" stroke-width="2" />
    
    <!-- Central Shield Security Symbol (Lock / Shield Icon) -->
    <path d="M 203 175 V 169 C 203 165.1 206.1 162 210 162 C 213.9 162 217 165.1 217 169 V 175 H 221 V 193 H 199 V 175 H 203 Z M 206 175 H 214 V 169 C 214 166.8 212.2 165 210 165 C 207.8 165 206 166.8 206 169 V 175 Z"
          fill="#22D3EE" />

    <!-- Holographic Scan Lines Inside Shield -->
    <line x1="140" y1="140" x2="280" y2="140" stroke="#22D3EE" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="3 3" />
    <line x1="145" y1="210" x2="275" y2="210" stroke="#22D3EE" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="3 3" />
    <line x1="160" y1="250" x2="260" y2="250" stroke="#14B8A6" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="3 3" />
  </g>

  <!-- Telemetry Badge (Verified In-Browser Offline) -->
  <g transform="translate(130, 320)">
    <rect x="0" y="0" width="160" height="26" rx="13" fill="#102A43" stroke="#22D3EE" stroke-opacity="0.5" stroke-width="1" />
    <circle cx="16" cy="13" r="4" fill="#22C55E" class="pulse-node" />
    <text x="30" y="17" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.04em">LOCAL SECURE CORE</text>
  </g>
</svg>
